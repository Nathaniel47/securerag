services:
  api:
    build: .
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    env_file: [.env]
    volumes: ["./data:/app/data", "./results:/app/results"]
    mem_limit: 3g
  ui:
    build: .
    command: ["streamlit", "run", "ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports: ["8501:8501"]
    environment:
      SECURERAG_API_URL: http://api:8000
      PYTHONPATH: /app
    depends_on: [api]
    mem_limit: 1g
  ollama:  # optional: docker compose --profile ollama up
    image: ollama/ollama
    profiles: ["ollama"]
    ports: ["11434:11434"]
