[project]
name = "securerag"
version = "0.1.0"
description = "RAG security testbed: attacks, defenses and automatic scoring over Ghana-related Wikipedia articles"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["securerag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
